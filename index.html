<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordatium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Data Flow Pipelines -->
    <div class="data-pipelines">
      <svg
        class="pipeline pipeline-left"
        viewBox="0 0 200 600"
        preserveAspectRatio="none"
      >
        <path class="pipe-line" d="M100,0 L100,150 Q100,200 150,200 L200,200" />
        <circle class="data-dot" cx="100" cy="0" r="4" />
      </svg>
      <svg
        class="pipeline pipeline-right"
        viewBox="0 0 200 600"
        preserveAspectRatio="none"
      >
        <path class="pipe-line" d="M100,0 L100,150 Q100,200 50,200 L0,200" />
        <circle class="data-dot" cx="100" cy="0" r="4" />
      </svg>
      <svg
        class="pipeline pipeline-bottom-left"
        viewBox="0 0 200 600"
        preserveAspectRatio="none"
      >
        <path
          class="pipe-line"
          d="M200,300 L150,300 Q100,300 100,350 L100,600"
        />
        <circle class="data-dot" cx="200" cy="300" r="4" />
      </svg>
      <svg
        class="pipeline pipeline-bottom-right"
        viewBox="0 0 200 600"
        preserveAspectRatio="none"
      >
        <path class="pipe-line" d="M0,300 L50,300 Q100,300 100,350 L100,600" />
        <circle class="data-dot" cx="0" cy="300" r="4" />
      </svg>
    </div>

    <!-- Data Warehouse Icon -->
    <div class="warehouse warehouse-left">
      <svg viewBox="0 0 60 60" xmlns="https://www.w3.org/2000/svg">
        <ellipse
          cx="30"
          cy="12"
          rx="25"
          ry="8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M5,12 L5,48 Q5,56 30,56 Q55,56 55,48 L55,12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <ellipse
          cx="30"
          cy="28"
          rx="25"
          ry="6"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          opacity="0.5"
        />
        <ellipse
          cx="30"
          cy="42"
          rx="25"
          ry="6"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          opacity="0.5"
        />
      </svg>
    </div>
    <div class="warehouse warehouse-right">
      <svg viewBox="0 0 60 60" xmlns="https://www.w3.org/2000/svg">
        <ellipse
          cx="30"
          cy="12"
          rx="25"
          ry="8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M5,12 L5,48 Q5,56 30,56 Q55,56 55,48 L55,12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <ellipse
          cx="30"
          cy="28"
          rx="25"
          ry="6"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          opacity="0.5"
        />
        <ellipse
          cx="30"
          cy="42"
          rx="25"
          ry="6"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          opacity="0.5"
        />
      </svg>
    </div>

    <!-- Data Nodes -->
    <div class="data-nodes">
      <div class="node node-1"></div>
      <div class="node node-2"></div>
      <div class="node node-3"></div>
      <div class="node node-4"></div>
    </div>

    <div class="particles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <main class="container">
      <h1 class="title">Ordatium</h1>
      <p class="quote">'Once united, forever we shine.'</p>
    </main>
  </body>
</html>
